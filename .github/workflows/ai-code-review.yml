name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel any in-progress review for the same PR when new commits arrive
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip bot-created PRs (Dependabot, Renovate, etc.)
    if: >
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch enough history to produce a meaningful diff
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install review dependencies
        run: pip install --quiet google-generativeai PyGithub

      - name: Run AI Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python .github/scripts/ai_review.py
